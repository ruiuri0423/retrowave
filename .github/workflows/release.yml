name: Release (Windows onefile)

# 觸發：推 v* 標籤（例 v1.27）自動建置並發佈 Release；也可手動觸發只取 artifact。
#
# 防毒/SmartScreen 緩解（詳見 docs/DEVELOPMENT.md「發佈與簽章」）：
#   - 嵌入版本資訊中繼資料（無中繼資料是啟發式扣分項）、--noupx
#   - 同步產出 onedir zip（不自解壓，誤判率遠低於 onefile）與 SHA256 校驗檔
#   - 程式碼簽章為「預留位」：設定 repo secrets CODESIGN_PFX_BASE64 與
#     CODESIGN_PFX_PASSWORD 後自動以 signtool 簽章（含時間戳記）；
#     未設定則跳過。憑證需向 CA 申請（SignPath 開源免費 / Azure Trusted
#     Signing / OV / EV），無法自行生成 — 自簽憑證對 SmartScreen 無效。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write          # 建立 Release 需要
    env:
      HAS_CERT: ${{ secrets.CODESIGN_PFX_BASE64 != '' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pillow pyinstaller

      - name: Run test suite
        run: python -m pytest -q

      - name: Read version
        id: ver
        shell: pwsh
        run: |
          $v = python -c "import sys; sys.path.insert(0,'src'); import retrowave; print(retrowave.__version__)"
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Generate Windows version-info resource
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $parts = $v.Split('.'); $maj = $parts[0]; $min = $parts[1]
          @"
          VSVersionInfo(
            ffi=FixedFileInfo(filevers=($maj, $min, 0, 0), prodvers=($maj, $min, 0, 0),
                              mask=0x3f, flags=0x0, OS=0x40004, fileType=0x1, subtype=0x0),
            kids=[StringFileInfo([StringTable('040404b0', [
                    StringStruct('CompanyName', 'ruiuri0423 (RetroWave open source)'),
                    StringStruct('FileDescription', 'RetroWave digital timing / waveform editor'),
                    StringStruct('FileVersion', '$v'),
                    StringStruct('ProductName', 'RetroWave'),
                    StringStruct('ProductVersion', '$v'),
                    StringStruct('LegalCopyright', 'MIT License (c) 2026 Ricky (ruiuri0423)'),
                    StringStruct('OriginalFilename', 'RetroWave.exe')])]),
                  VarFileInfo([VarStruct('Translation', [1028, 1200])])])
          "@ | Out-File -Encoding utf8 version_info.txt

      - name: Build onefile exe
        run: >
          pyinstaller --onefile --windowed --noupx --name RetroWave
          --version-file version_info.txt --paths src run.py

      - name: Build onedir variant (lower AV false-positive rate)
        run: >
          pyinstaller --windowed --noupx --name RetroWave
          --version-file version_info.txt --paths src
          --distpath dist_onedir run.py

      - name: Sign binaries (only when cert secrets are configured)
        if: env.HAS_CERT == 'true'
        shell: pwsh
        run: |
          $pfx = "$env:RUNNER_TEMP\codesign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String("${{ secrets.CODESIGN_PFX_BASE64 }}"))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" |
                      Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          & $signtool sign /f $pfx /p "${{ secrets.CODESIGN_PFX_PASSWORD }}" `
            /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 `
            dist\RetroWave.exe dist_onedir\RetroWave\RetroWave.exe
          Remove-Item $pfx -Force
          & $signtool verify /pa dist\RetroWave.exe

      - name: Package artifacts + SHA256 checksums
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          Rename-Item dist/RetroWave.exe "RetroWave-v$v-windows.exe"
          Compress-Archive -Path dist_onedir/RetroWave -DestinationPath "dist/RetroWave-v$v-windows-onedir.zip"
          $files = Get-ChildItem dist | Where-Object { $_.Name -match '^RetroWave' }
          $lines = $files | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash, $_.Name }
          $lines | Out-File -Encoding ascii dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt
          if (!(Test-Path "dist/RetroWave-v$v-windows.exe")) { exit 1 }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RetroWave-v${{ steps.ver.outputs.version }}-windows
          path: |
            dist/RetroWave-v${{ steps.ver.outputs.version }}-windows.exe
            dist/RetroWave-v${{ steps.ver.outputs.version }}-windows-onedir.zip
            dist/SHA256SUMS.txt

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/RetroWave-v${{ steps.ver.outputs.version }}-windows.exe
            dist/RetroWave-v${{ steps.ver.outputs.version }}-windows-onedir.zip
            dist/SHA256SUMS.txt
          generate_release_notes: true
